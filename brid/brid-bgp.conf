log syslog all;

router id 10.0.0.2;

define ROS_AS  = 65001;
define BIRD_AS = 65002;

protocol device {
  scan time 10;
  interface "-dae*";
}

protocol kernel {
  ipv4 {
    import none;
    export none;
  };
  learn;
}

protocol kernel {
  ipv6 {
    import none;
    export none;
  };
  learn;
}

protocol static {
  ipv4;
  include "/etc/bird/routes4.conf";
}

protocol static {
  ipv6;
  include "/etc/bird/routes6.conf";
}

filter export_foreign4 {
  if net = 0.0.0.0/0 then reject;

  if source = RTS_STATIC then accept;
  reject;
}

filter export_foreign6 {
  if net = ::/0 then reject;

  if source = RTS_STATIC then accept;
  reject;
}

# IPv4 eBGP
protocol bgp ros4 {
  local 10.0.0.2 as BIRD_AS;
  neighbor 10.0.0.1 as ROS_AS;

  hold time 30;
  keepalive time 10;

  ipv4 {
    import none;
    export filter export_foreign4;
    next hop self;
  };
}

# IPv6 eBGP
protocol bgp ros6 {
  local fd00::2 as BIRD_AS;
  neighbor fd00::1 as ROS_AS;

  hold time 30;
  keepalive time 10;

  ipv6 {
    import none;
    export filter export_foreign6;
    next hop self;
  };
}