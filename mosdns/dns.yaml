plugins:
  # ==================== 上游 DNS 转发器 ====================
  # Google 公共 DNS (DoH / DoT)，用于国外域名解析
  - tag: google
    type: forward
    args:
      concurrent: 2
      upstreams:
        # DoH
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8"
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.4.4"
        # DoT
        - addr: "tls://dns.google"
          dial_addr: "8.8.8.8"
          enable_pipeline: true
        - addr: "tls://dns.google"
          dial_addr: "8.8.4.4"
          enable_pipeline: true

  # Cloudflare DNS (DoH / DoT)，作为国外备用
  - tag: cloudflare
    type: forward
    args:
      concurrent: 2
      upstreams:
        # DoH
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.1.1.1"
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.0.0.1"
        # DoT
        - addr: "tls://one.one.one.one"
          dial_addr: "1.1.1.1"
          enable_pipeline: true
        - addr: "tls://one.one.one.one"
          dial_addr: "1.0.0.1"
          enable_pipeline: true

  # 阿里公共 DNS (DoQ / DoH / DoT)，用于国内域名解析
  - tag: ali
    type: forward
    args:
      concurrent: 2
      upstreams:
        # DoQ
        - addr: "quic://dns.alidns.com"
          dial_addr: "223.5.5.5"
        - addr: "quic://dns.alidns.com"
          dial_addr: "223.6.6.6"
        - addr: "quic://dns.alidns.com"
          dial_addr: "2400:3200::1"
        - addr: "quic://dns.alidns.com"
          dial_addr: "2400:3200:baba::1"
        # DoH
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "223.5.5.5"
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "223.6.6.6"
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "2400:3200::1"
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "2400:3200:baba::1"
        # DoT
        - addr: "tls://dns.alidns.com"
          dial_addr: "223.5.5.5"
          enable_pipeline: true
        - addr: "tls://dns.alidns.com"
          dial_addr: "223.6.6.6"
          enable_pipeline: true
        - addr: "tls://dns.alidns.com"
          dial_addr: "2400:3200::1"
          enable_pipeline: true
        - addr: "tls://dns.alidns.com"
          dial_addr: "2400:3200:baba::1"
          enable_pipeline: true

  # DNSPod 公共 DNS (DoH / DoT)，作为国内备用
  - tag: dnspod
    type: forward
    args:
      concurrent: 2
      upstreams:
        # DoH
        - addr: "https://doh.pub/dns-query"
          dial_addr: "119.29.29.29"
        - addr: "https://doh.pub/dns-query"
          dial_addr: "2402:4e00::"
        # DoT
        - addr: "tls://dot.pub"
          dial_addr: "119.29.29.29"
          enable_pipeline: true
        - addr: "tls://dot.pub"
          dial_addr: "2402:4e00::"
          enable_pipeline: true

  # 本地 DNS 转发 (指向本机 53 端口，用于内网解析)
  - tag: local
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "udp://127.0.0.1:53"

  # ==================== 响应拒绝插件 ====================
  # 返回 SERVFAIL (服务端失败)
  - tag: reject_2
    type: sequence
    args:
      - exec: reject 2

  # 返回 NXDOMAIN (域名不存在)
  - tag: reject_3
    type: sequence
    args:
      - exec: reject 3

  # 返回 REFUSED (拒绝查询)
  - tag: reject_5
    type: sequence
    args:
      - exec: reject 5