plugins:
  # ==================== IP 与域名集合 ====================
  # 私有/局域网 IP 段（用于识别内网请求）
  - tag: geoip_private
    type: ip_set
    args:
      files:
        - "/etc/mosdns/geodat/geoip_private.txt"
        
  # 中国 IP 段（用于判定响应 IP 是否属于国内）
  - tag: geoip_cn
    type: ip_set
    args:
      files:
        - "/etc/mosdns/geodat/geoip_cn.txt"
        
  # 中国域名列表（匹配国内站点）
  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/geodat/geosite_cn.txt"
        
  # 手动白名单域名（强制走国内解析）
  - tag: whitelist
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/whitelist.txt"
        
  # GFW 域名列表（匹配被干扰/需代理的站点）
  - tag: geosite_gfw
    type: domain_set
    args:
      files:
        - "/etc/mosdns/geodat/geosite_gfw.txt"
        
  # 非中国地区域名（匹配国外站点）
  - tag: geosite_location-nocn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/geodat/geosite_geolocation-nocn.txt"

  # ==================== DNS 缓存 ====================
  # 内网缓存（用于局域网域名 / 私有 PTR 解析）
  - tag: cache_lan
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400
      dump_file: /etc/mosdns/lan_cache.dump
      dump_interval: 600

  # 全局缓存（用于国内/国外/未知域名的解析结果）
  - tag: cache_wan
    type: cache
    args:
      size: 131072
      lazy_cache_ttl: 86400
      dump_file: /etc/mosdns/wan_cache.dump
      dump_interval: 600

  # ==================== EDNS Client Subnet 处理 ====================
  # 禁用 ECS（查询上游时隐藏客户端子网）
  - tag: no_ecs
    type: "ecs_handler"
    args:
      forward: false
      send: false
      mask4: 24
      mask6: 48

  # 附加国内 ECS（向国内 DNS 上报特定 IP 子网，优化 CDN 调度）
  - tag: ecs_cn
    type: "ecs_handler"
    args:
      forward: false
      preset: "100.102.200.1"
      send: true
      mask4: 24
      mask6: 48

  # ==================== TTL 调整 ====================
  # 强制 TTL 为 1 分钟
  - tag: ttl_1m
    type: sequence
    args:
      - exec: ttl 60
      
  # 强制 TTL 为 5 分钟
  - tag: ttl_5m
    type: sequence
    args:
      - exec: ttl 300
      
  # 强制 TTL 为 1 小时
  - tag: ttl_1h
    type: sequence
    args:
      - exec: ttl 3600